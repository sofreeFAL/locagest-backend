<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocaGest - Connexion</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="login-page">

<div class="main-frame">
  <div class="car-icon">
    <svg width="120" height="80" viewBox="0 0 120 80" fill="none">
      <rect x="20" y="40" width="80" height="20" rx="10" fill="#FF8C00"/>
      <rect x="40" y="25" width="40" height="15" rx="5" fill="#1A2332"/>
      <rect x="45" y="28" width="15" height="9" rx="2" fill="#E0E0E0"/>
      <rect x="60" y="28" width="15" height="9" rx="2" fill="#E0E0E0"/>
      <circle cx="35" cy="60" r="8" fill="#1A2332"/>
      <circle cx="85" cy="60" r="8" fill="#1A2332"/>
      <circle cx="35" cy="60" r="4" fill="#FF8C00"/>
      <circle cx="85" cy="60" r="4" fill="#FF8C00"/>
      <circle cx="25" y="45" r="5" fill="#FFD700"/>
      <circle cx="95" y="45" r="5" fill="#FFD700"/>
    </svg>
  </div>

  <!-- Titre -->
  <div class="app-title">
    <h1>LocaGest</h1>
    <p class="app-subtitle">Système de gestion de location de véhicules</p>
  </div>

  <!-- Formulaire -->
  <form id="loginForm" class="login-form">
    <!-- Nom d'utilisateur avec icône homme -->
    <div class="form-group">
      <div class="input-with-icon">
        <svg class="icon" width="20" height="20" viewBox="0 0 20 20" fill="#1A2332">
          <path d="M10 10c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
        <input type="text"
               id="username"
               placeholder="Nom d'utilisateur"
               value="admin"
               required>
      </div>
    </div>

    <!-- Mot de passe avec icône cadenas -->
    <div class="form-group">
      <div class="input-with-icon">
        <svg class="icon" width="20" height="20" viewBox="0 0 20 20" fill="#1A2332">
          <path d="M15 8h-1V5c0-2.76-2.24-5-5-5S4 2.24 4 5v3H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zM6 5c0-1.66 1.34-3 3-3s3 1.34 3 3v3H6V5z"/>
        </svg>
        <input type="password"
               id="password"
               placeholder="Mot de passe"
               value="1234"
               required>
      </div>
    </div>

    <!-- Bouton Se connecter avec flèche blanche -->
    <button type="submit" class="login-btn">
      Se connecter
      <svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="#FFFFFF">
        <path d="M8 0l8 8-8 8-2-2 6-6-6-6z"/>
      </svg>
    </button>

    <div id="errorMessage" class="error-message"></div>
  </form>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
